name = "kuniformes-app"
account_id = "053d6d9140fd678f8d5e1843dffa6298"
main = "worker.mjs"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
assets = { directory = ".open-next/assets", binding = "ASSETS" }

[triggers]
crons = ["*/30 * * * *"]

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "kuniformes-app"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "kuniformes-db"
database_id = "eb70baca-4155-4bdd-bfd9-6dc14da30795"
migrations_dir = "src/lib/db/migrations"

# R2 Bucket (optional: enable in Cloudflare Dashboard if needed)
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "kuniformes-assets"

