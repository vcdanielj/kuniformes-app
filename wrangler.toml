name = "kuniformes-app"
main = "worker.mjs"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
assets = { directory = ".open-next/assets", binding = "ASSETS" }

[triggers]
crons = ["*/30 * * * *"]

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "kuniformes-app"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "kuniformes-db"
database_id = "3f872ad5-9638-43d1-91f5-9e8895963cef"
migrations_dir = "src/lib/db/migrations"

# R2 Bucket (optional: enable in Cloudflare Dashboard if needed)
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "kuniformes-assets"

